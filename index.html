<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Mes vidéos YouTube</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            color: #111827;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 18px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 7px 0;
            font-size: 25px;
        }

        header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.7;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }

        .summary {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .channel {
            background: white;
            border-radius: 13px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.08);
        }

        .channel summary {
            cursor: pointer;
            list-style: none;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-weight: 600;
            user-select: none;
        }

        .channel summary::-webkit-details-marker {
            display: none;
        }

        .channel summary::after {
            content: "›";
            font-size: 25px;
            color: #9ca3af;
            transition: transform 0.2s;
        }

        .channel[open] summary::after {
            transform: rotate(90deg);
        }

        .channel-name {
            font-size: 17px;
        }

        .video-count {
            color: #6b7280;
            font-size: 14px;
            white-space: nowrap;
        }

        .videos {
            border-top: 1px solid #e5e7eb;
        }

        .video {
            padding: 17px;
            border-bottom: 1px solid #e5e7eb;
        }

        .video:last-child {
            border-bottom: none;
        }

        .video-title {
            font-size: 16px;
            line-height: 1.45;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .video-date {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .youtube-button {
            display: block;
            background: #dc2626;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .youtube-button:active {
            opacity: 0.8;
        }

        .empty {
            background: white;
            border-radius: 13px;
            padding: 30px;
            text-align: center;
            color: #6b7280;
        }

    </style>

</head>

<body>

<header>

    <h1>📺 Mes vidéos YouTube</h1>

    <p>
        Vidéos publiées durant les 7 derniers jours
    </p>

</header>

<main>

    <div class="summary">
        0 vidéos trouvée(s)
    </div>

    <div class="empty">Aucune vidéo trouvée durant les 7 derniers jours.</div>

</main>

</body>

</html>
